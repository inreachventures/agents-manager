# agentmgr tmux config — generated by `wm`, overwritten on upgrade. Does not affect your own tmux.

set -g default-terminal "xterm-256color"
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on

# Terminal.app: scroll wheel scrolls history; drag-select copies to the macOS clipboard.
set -g mouse on
set -g set-clipboard off
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Navigation (prefix = C-b): C-b h → dashboard, C-b n → next workstream that needs you.
# Prefix bindings on purpose: Claude Code uses many Ctrl keys itself (e.g. C-g opens the editor).
bind h switch-client -t "=home"
bind n run-shell -b "@WM@ next --client '#{client_name}' --current '#{session_name}'"

# Status line: workstream label on the left, attention count on the right.
set -g status on
set -g status-interval 2
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 60
set -g status-left "#[bold] #(@WM@ status-line --left '#{session_name}') #[nobold]"
set -g status-right-length 80
set -g status-right "#(@WM@ status-line --right)  C-b h home · C-b n next "
set -g window-status-format ""
set -g window-status-current-format ""

# Top bar: your latest message to Claude, so you can tell where the current reply starts.
# The UserPromptSubmit hook sets @wm_prompt on the session (the dashboard session turns the bar off).
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour238"
set -g pane-border-format "#{?@wm_prompt,#[fg=colour255#,bg=colour25#,bold] ❯ #{@wm_prompt} #[default],#[fg=colour244] no message yet }"

# Terminal window title: the workstream's ticket + 3-word name (e.g. "PROJ-313 dark mode toggle").
set -g set-titles on
set -g set-titles-string "#(@WM@ status-line --title '#{session_name}')"

# Closing the terminal window detaches; sessions keep running.
set -g detach-on-destroy off
set -g destroy-unattached off
