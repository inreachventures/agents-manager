# Tests on every push and pull request to main, then builds Workstreams.app for Apple silicon and Intel (the disk
# images are attached to the run). A tag like v0.2.0 also publishes them as a GitHub release, with the update feed
# each chip's app checks (appcast-apple-silicon.xml, appcast-intel.xml); the tag has to match the version in
# pyproject.toml. The app is signed ad hoc, not with a Developer ID: see .github/release-notes.md. The disk images
# are also signed for Sparkle, the in-app updater, with the secret SPARKLE_ED_PRIVATE_KEY.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml says $version"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tmux
        run: brew install tmux
      - name: Install wm
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e . --group dev
      - name: Lint
        run: .venv/bin/ruff check src tests macos/scripts
      - name: Test
        run: .venv/bin/pytest -q

  build:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build Workstreams.app for Apple silicon and Intel
        run: macos/scripts/build-app.sh --release all
      - uses: actions/upload-artifact@v7
        with:
          name: Workstreams-disk-images
          path: macos/build/Workstreams-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15  # Sparkle's sign_update is a macOS tool
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Workstreams-disk-images
          path: dist
      - name: Get Sparkle's sign_update
        run: cd macos && swift package resolve
      # Each chip's app reads releases/latest/download/appcast-CHIP.xml and installs the disk image it names after
      # checking its signature against the public key in the app (SUPublicEDKey in macos/scripts/build-app.sh).
      - name: Sign the disk images and write the update feeds
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::the secret SPARKLE_ED_PRIVATE_KEY is not set"; exit 1; }
          version=${GITHUB_REF_NAME#v}
          base=https://github.com/inreachventures/agents-manager/releases  # as SUFeedURL in build-app.sh
          for chip in apple-silicon intel; do
            dmg=dist/Workstreams-$version-$chip.dmg
            # prints: sparkle:edSignature="..." length="..."; the key goes in on stdin, never on the command line
            signed=$(macos/.build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "$dmg" <<< "$SPARKLE_ED_PRIVATE_KEY")
            signature=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<< "$signed")
            length=$(sed -n 's/.*length="\([0-9]*\)".*/\1/p' <<< "$signed")
            [ -n "$signature" ] && [ -n "$length" ] || { echo "::error::sign_update gave no signature for $dmg"; exit 1; }
            python3 macos/scripts/make_appcast.py --version "$version" --chip "$chip" \
              --dmg-url "$base/download/$GITHUB_REF_NAME/Workstreams-$version-$chip.dmg" \
              --signature "$signature" --length "$length" --release-url "$base/tag/$GITHUB_REF_NAME" \
              > "dist/appcast-$chip.xml"
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/appcast-apple-silicon.xml dist/appcast-intel.xml \
            --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
