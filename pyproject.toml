[project]
name = "agentmgr"
version = "0.1.0"
description = "Local manager for multi-repo Claude Code workstreams"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "textual>=0.80",
    "rapidfuzz>=3.9",
]

[project.scripts]
wm = "agentmgr.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmgr"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
